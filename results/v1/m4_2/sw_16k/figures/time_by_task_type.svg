<svg class="chart" viewBox="0 0 796 512" width="100%" role="img" aria-label="Where the time goes, sw_16k" xmlns="http://www.w3.org/2000/svg"><style>
:root{color-scheme:light;--surface:#fcfcfb;--page:#f9f9f7;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;
